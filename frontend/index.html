<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoDelivery - Login / Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="auth-box">
            <h2 id="auth-title">Fazer Login</h2>
            
            <div id="error-message" class="error-box hidden"></div>

            <form id="auth-form">
                <div id="register-fields" class="hidden">
                    <label>Nome:</label>
                    <input type="text" id="nome-input" placeholder="Seu nome completo">
                    
                    <label>Sua Localização (Simulada para o Mapa):</label>
                    <div class="geo-inputs">
                        <input type="number" step="any" id="lat-input" placeholder="Latitude (Ex: -15.31)">
                        <input type="number" step="any" id="lon-input" placeholder="Longitude (Ex: -49.01)">
                    </div>
                    <button type="button" id="btn-gps" class="btn-secondary">Pegar GPS Atual</button>
                </div>

                <label>E-mail:</label>
                <input type="email" id="email-input" placeholder="seu@email.com" required>

                <label>Senha:</label>
                <input type="password" id="senha-input" placeholder="******" required>

                <button type="submit" id="btn-submit" class="btn-primary">Entrar</button>
            </form>

            <p id="toggle-auth">Não tem uma conta? <span id="toggle-link">Cadastre-se aqui</span></p>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
